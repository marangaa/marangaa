name: life-interact

# Visitors play by opening an issue titled e.g. "life: 12,5 13,5 14,5"
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'life:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: apply move
        run: |
          COORDS=$(echo "${{ github.event.issue.title }}" | sed 's/^life://' | tr -d '[]()')
          python scripts/life.py toggle $COORDS

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/life.json dist/life.svg
          git commit -m "move by @${{ github.event.issue.user.login }} (issue #${{ github.event.issue.number }})"
          git push

      - name: thank the player
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🧬 your cells are in. check the profile README in a moment — the world has changed."
            });
