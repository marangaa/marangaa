name: game-of-life

on:
  schedule:
    - cron: "0 */6 * * *"   # one generation every 6 hours
  workflow_dispatch:         # manual "advance" button in the Actions tab
  push:
    paths:
      - "scripts/life.py"

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: advance one generation
        run: python scripts/life.py step

      - name: commit new world
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/life.json dist/life.svg
          git commit -m "generation $(python -c "import json;print(json.load(open('state/life.json'))['generation'])")" || echo "no changes"
          git push
